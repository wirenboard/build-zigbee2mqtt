# Auth-check cache zone for the Zigbee2MQTT frontend gate (http-context —
# installed into /etc/nginx/conf.d/, which nginx.conf includes inside http{}).
#
# Caches the homeui auth verdict per session for a few seconds (consumed by the
# internal location in default.wb.d/wb-zigbee2mqtt.conf), so the frontend's
# open-time burst of auth_request subrequests collapses to ~1 real /auth/check
# per window and stays under wb-homeui-back's global 100-req/min limit.
#
# Stored on tmpfs (/run) so the auth cache never writes to the controller flash.
proxy_cache_path /run/wb-zigbee2mqtt-auth-cache levels=1:2 keys_zone=wb_zigbee2mqtt_auth:1m max_size=8m inactive=60s use_temp_path=off;
