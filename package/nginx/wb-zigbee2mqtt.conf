# Zigbee2MQTT frontend gated behind the homeui session. Dropped into
# /etc/nginx/includes/default.wb.d/, which is included INSIDE the homeui server
# block (same origin as homeui, so the homeui session cookie reaches
# auth_request). z2m frontend runs on 127.0.0.1:8081 with base_url=/zigbee2mqtt
# (configuration.yaml), so its URLs already carry this prefix and nginx forwards
# the path unchanged (proxy_pass WITHOUT a trailing slash / URI).
#
# Reuses homeui's own `location /auth/check { internal; }` and the
# `wb-homeui-back` upstream declared in
# /usr/share/wb-mqtt-homeui/nginx/default.conf.
#
# Everything under /zigbee2mqtt/ (the UI page, the static JS/CSS bundles AND the
# /zigbee2mqtt/api websocket) is admin-gated — no static carve-out. The z2m
# frontend is a Vite SPA that loads only a handful of assets on open, so the
# auth_request burst stays well under wb-homeui-back's global 100-req/min limit
# on /auth/check; the short per-session cache below collapses it to ~1 real
# check per window anyway. Gating the static too means the frontend's very
# existence is not exposed to an unauthenticated client.

location = /zigbee2mqtt { return 301 /zigbee2mqtt/; }

# Regex (not prefix) on purpose: this include sits first in the server block, so
# a regex here is evaluated BEFORE homeui's own `location ~* \.(js|css|...)$`.
# A prefix location would lose /zigbee2mqtt/<asset>.js to that homeui static
# regex and 404 it from /var/www. Covers UI, bundles and the /api websocket.
location ~ ^/zigbee2mqtt/ {
    set $required_user_type "admin";
    auth_request /wb_zigbee2mqtt_auth_check;

    # Unauthenticated -> homeui login (relative, same origin), carrying our
    # destination as externalReturn. homeui >= 2.230.0 reads it from the real
    # query and does a full-page navigation back to /zigbee2mqtt/ after login;
    # older homeui ignores it (graceful: lands on the dashboard).
    error_page 401 = @wb_zigbee2mqtt_login;

    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

location @wb_zigbee2mqtt_login {
    return 302 /login/?externalReturn=/zigbee2mqtt/;
}

# Cached auth-check for the gate. Mirrors homeui's own /auth/check (same upstream,
# same Required-User-Type contract) but caches the verdict per session for a few
# seconds. Cache key = homeui session cookie ("id") + required user type, so a
# verdict is NEVER shared across sessions. Short TTLs bound post-logout exposure.
location = /wb_zigbee2mqtt_auth_check {
    internal;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Required-User-Type $required_user_type;
    proxy_pass http://wb-homeui-back/auth/check;

    proxy_cache wb_zigbee2mqtt_auth;
    proxy_cache_key "$cookie_id|$required_user_type";
    proxy_cache_valid 200 5s;
    proxy_cache_valid 401 403 2s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
}
