homeassistant: false
permit_join: false
mqtt:
  base_topic: zigbee2mqtt
  server: 'mqtt://localhost'
serial:
  port: /dev/ttyMOD4
  adapter: zstack
advanced:
  rtscts: false
  last_seen: epoch
  pan_id: GENERATE
  network_key: GENERATE
availability:
  enabled: true
  active:
    timeout: 10
    max_jitter: 30000
    backoff: true
frontend:
  enabled: true
  # Loopback only: the frontend is never exposed directly. Public access goes
  # through nginx (default.wb.d/wb-zigbee2mqtt.conf), gated by the homeui session.
  host: 127.0.0.1
  port: 8081
  # Served under a subpath behind nginx (same origin as homeui), so the UI and
  # its /api websocket live under /zigbee2mqtt/.
  base_url: /zigbee2mqtt
